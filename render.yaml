# Render Blueprint: creates the web app and a PostgreSQL database.
# On render.com: New → Blueprint → pick this repository.
services:
  - type: web
    name: calorie-organizer
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run db:push:force && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-organizer-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false

databases:
  - name: calorie-organizer-db
    plan: free
